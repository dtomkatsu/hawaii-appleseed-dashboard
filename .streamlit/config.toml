[server]
# Cloud Run deployment: behind Google's reverse proxy
maxUploadSize = 200
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = false
enableWebsocketCompression = false
headless = true
runOnSave = false
port = 8080
address = "0.0.0.0"

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8080

[theme]
primaryColor = "#2a5a0c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"

[global]
developmentMode = false

[logger]
level = "info"

[runner]
magicEnabled = false
installTracer = false
fixMatplotlib = true
postScriptGC = true
fastReruns = true
enforceSerializableSessionState = false
