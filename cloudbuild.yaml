steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:$COMMIT_SHA', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:$COMMIT_SHA']
  
  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:$COMMIT_SHA', 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:latest']
  
  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:latest']
  
  # Deploy to Cloud Run with session affinity and WebSocket-friendly config
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hi-data-dashboard'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:latest'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--port=8080'
      - '--max-instances=5'
      - '--min-instances=1'
      - '--timeout=3600s'
      - '--concurrency=1'
      - '--no-cpu-throttling'
      - '--ingress=all'
      - '--set-env-vars=STREAMLIT_SERVER_MAX_MESSAGE_SIZE=200'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hawaii-appleseed-dashboard/hi-data-dashboard:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
