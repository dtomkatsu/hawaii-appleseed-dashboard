<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Analysis — Hawaii Appleseed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/hawaii-appleseed-dashboard/assets/loader-xgymrUWK.js"></script>
    <script type="module" crossorigin src="/hawaii-appleseed-dashboard/assets/analysis-main-F9P2-Q7v.js"></script>
    <link rel="stylesheet" crossorigin href="/hawaii-appleseed-dashboard/assets/analysis-main-DswH9bl7.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="/assets/logo.png" alt="Hawaii Appleseed" class="brand-logo" onerror="this.style.display='none'" />
        <h1>Hawaii Data Dashboard</h1>
      </div>
      <nav class="header-nav"><a href="/">← Back to Map</a></nav>
    </header>
    <main class="da-main" id="da-standalone">
      <div class="da-controls-row">
        <div id="da-controls" class="da-controls"></div>
      </div>
      <div class="da-chart-row">
        <div class="da-chart-wrap">
          <p class="da-section-label">Ranked comparison</p>
          <div id="da-chart"></div>
        </div>
        <div class="da-table-wrap">
          <p class="da-section-label">Selected variable</p>
          <div id="da-side-table"></div>
        </div>
      </div>
      <hr class="da-divider" />
      <p class="da-section-label">Full data table</p>
      <div id="da-full-table" class="da-full-table-wrap"></div>
    </main>
  </body>
</html>
